name: openvas
version: 1.0.0
category: vulnerability_scanner
description: OpenVAS vulnerability scanner integration for security assessments
author: AutonomAI Team
license: MIT

execution:
  local:
    binary: gvm-cli
    timeout: 300
    alternate_paths:
      - /usr/bin/gvm-cli
      - /usr/local/bin/gvm-cli
      - /opt/openvas/bin/gvm-cli
    sandbox: true
    capabilities:
      - NET_RAW
      - NET_ADMIN

schemas:
  input:
    type: object
    required:
      - target
    properties:
      target:
        type: string
        description: Target IP address, hostname, or network range
        examples:
          - "192.168.1.1"
          - "example.com"
          - "192.168.1.0/24"
      scan_config:
        type: string
        description: Scan configuration profile
        enum: [full, fast, host_discovery]
        default: fast
      scan_name:
        type: string
        description: Custom name for the scan
        default: "AutonomAI Scan"

  output:
    type: object
    properties:
      scan_id:
        type: string
        description: Unique identifier for the scan
      status:
        type: string
        description: Current scan status
      target:
        type: string
        description: Target that was scanned
      start_time:
        type: string
        description: Scan start time
      end_time:
        type: string
        description: Scan end time
      vulnerabilities:
        type: array
        description: List of discovered vulnerabilities
        items:
          type: object
          properties:
            severity:
              type: string
              description: Vulnerability severity level
            name:
              type: string
              description: Vulnerability name
            description:
              type: string
              description: Vulnerability description

opsec:
  enabled: true
  risk_level: medium
  noise_level: high
  detection_methods:
    - Network scanning
    - Port scanning
    - Vulnerability probing
  evasion_recommendations:
    - Use slow scan timing templates
    - Randomize scan order
    - Use decoy hosts
    - Implement scan delays

dependencies:
  - name: python-gvm
    version: ">=1.0.0"
  - name: gvm-cli
    install_url: https://www.greenbone.net/en/install/

health_check:
  enabled: true
  command: gvm-cli --version
  interval: 120
  timeout: 10

hooks:
  pre_execution:
    - validate_target
    - check_scan_permissions
  post_execution:
    - parse_results
    - generate_report
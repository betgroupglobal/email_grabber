# OpSec Policy Configuration
# Controls thresholds and active rules for the OpSec Monitor.

policy:
  max_acceptable_risk_score: 40
  auto_block_on_critical: true
  require_log_clearing: true
  require_timing_strategy: true

severity_weights:
  critical: 40
  high: 20
  medium: 10
  low: 5
  info: 1

active_rules:
  - OPSEC-001   # noisy tools
  - OPSEC-002   # plaintext exfil
  - OPSEC-003   # visibility of persistence
  - OPSEC-004   # log clearing
  - OPSEC-005   # timing awareness
  - OPSEC-006   # credential exposure
  - OPSEC-007   # attribution artefacts

evasion_defaults:
  timing:
    min_delay_seconds: 0.5
    max_delay_seconds: 3.0
    operate_hours: "09:00-17:00"   # blend with business traffic
  encoding:
    prefer: ["base64", "xor", "zlib+base64"]
    avoid: ["none", "plaintext"]
  c2_channels:
    preferred: ["https", "dns-tunnel", "icmp-tunnel"]
    avoid: ["http", "raw-tcp", "ftp"]

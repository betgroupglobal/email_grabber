name: Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/dashboard/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend/dashboard
        run: npm ci

      - name: Run frontend lint and build
        working-directory: ./frontend/dashboard
        run: |
          npm run lint
          npm run build
        env:
          NEXT_PUBLIC_ORCHESTRATOR_URL: http://localhost:3001
          NEXT_PUBLIC_ANALYZER_URL: http://localhost:8001
          NEXT_PUBLIC_KNOWLEDGE_ENGINE_URL: http://localhost:8000
          NEXT_PUBLIC_OPSEC_URL: http://localhost:8002

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [knowledge-engine, orchestrator, integration-hub, dashboard]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Resolve build context
        id: buildctx
        run: |
          case "${{ matrix.service }}" in
            knowledge-engine) echo "context=./backend" >> $GITHUB_OUTPUT; echo "file=./backend/knowledge_engine/Dockerfile" >> $GITHUB_OUTPUT ;;
            orchestrator) echo "context=./backend/orchestrator" >> $GITHUB_OUTPUT; echo "file=./backend/orchestrator/Dockerfile" >> $GITHUB_OUTPUT ;;
            integration-hub) echo "context=./backend/integrations" >> $GITHUB_OUTPUT; echo "file=./backend/integrations/Dockerfile" >> $GITHUB_OUTPUT ;;
            dashboard) echo "context=./frontend/dashboard" >> $GITHUB_OUTPUT; echo "file=./frontend/dashboard/Dockerfile" >> $GITHUB_OUTPUT ;;
          esac

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.buildctx.outputs.context }}
          file: ${{ steps.buildctx.outputs.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production

  security-scan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  deploy:
    needs: [build-and-push, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: https://yourdomain.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to production
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            cd /opt/opsec-platform
            git pull origin main
            docker-compose -f docker-compose.prod.yml --env-file .env.production pull
            docker-compose -f docker-compose.prod.yml --env-file .env.production up -d
            docker-compose -f docker-compose.prod.yml --env-file .env.production exec -T postgres pg_dump -U opsec_prod_user attack_db_prod > backups/pre_deploy_$(date +%Y%m%d_%H%M%S).sql
          ENDSSH

      - name: Health check
        run: |
          sleep 30
          curl -f https://yourdomain.com/health || exit 1

      - name: Notify deployment status
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Production deployment ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  rollback:
    runs-on: ubuntu-latest
    if: failure()
    needs: deploy
    steps:
      - name: Rollback deployment
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
            cd /opt/opsec-platform
            docker-compose -f docker-compose.prod.yml --env-file .env.production down
            docker-compose -f docker-compose.prod.yml --env-file .env.production up -d
          ENDSSH

      - name: Notify rollback
        uses: 8398a7/action-slack@v3
        with:
          status: 'failure'
          text: 'Production deployment failed - rollback initiated'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
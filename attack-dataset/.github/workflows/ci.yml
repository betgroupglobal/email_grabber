name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_ORCHESTRATOR_URL: http://localhost:3001
          NEXT_PUBLIC_ANALYZER_URL: http://localhost:8001
          NEXT_PUBLIC_KNOWLEDGE_ENGINE_URL: http://localhost:8000
          NEXT_PUBLIC_OPSEC_URL: http://localhost:8002

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run live-attack council unit tests
        run: node --test backend/orchestrator/live-attack/__tests__/*.test.js
      - name: Run orchestrator MCP and tool catalog tests
        run: node --test backend/orchestrator/__tests__/mcpClient.test.js backend/orchestrator/__tests__/toolCatalog.test.js
        env:
          MCP_MOCK: "1"
          MCP_BURP_ENABLED: "1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r backend/knowledge_engine/requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Run knowledge-engine unit tests
        run: |
          python -m pytest tests/knowledge-engine/test_models.py tests/knowledge-engine/test_config.py tests/knowledge-engine/test_live_replan.py -q --tb=short
        env:
          POSTGRES_DSN: postgresql://opsec:opsec@localhost:5432/attack_db
          QDRANT_HOST: localhost
          QDRANT_PORT: "6333"
      - name: Run live council e2e module tests
        run: python -m pytest tests/e2e/test_live_council_pivot.py -q --tb=short

services:
  # ── Infrastructure ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: opsec-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opsec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-attack_db}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./config/postgres/prod-init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opsec} -d ${POSTGRES_DB:-attack_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped
    networks:
      - opsec-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: opsec-qdrant-prod
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_prod_data:/qdrant/storage
      - ./config/qdrant/production.yaml:/qdrant/config/production.yaml
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    restart: unless-stopped
    networks:
      - opsec-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: opsec-redis-prod
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_prod_data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
    networks:
      - opsec-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Monitoring Stack ────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: opsec-prometheus-prod
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/monitoring/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_prod_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
    restart: unless-stopped
    networks:
      - opsec-network
    depends_on:
      - cadvisor

  grafana:
    image: grafana/grafana:10.3.0
    container_name: opsec-grafana-prod
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-piechart-panel,grafana-worldmap-panel
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://localhost:3001}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_prod_data:/var/lib/grafana
      - ./config/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./config/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 256M
    restart: unless-stopped
    networks:
      - opsec-network
    depends_on:
      - prometheus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: opsec-cadvisor-prod
    ports:
      - "${CADVISOR_PORT:-8080}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    restart: unless-stopped
    networks:
      - opsec-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ── Application Services ───────────────────────────────────────────────────────
  knowledge-engine:
    build:
      context: ./backend/knowledge_engine
      dockerfile: Dockerfile
      target: production
    image: opsec/knowledge-engine:latest
    ports:
      - "${KNOWLEDGE_ENGINE_PORT:-8000}:8000"
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-opsec}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-attack_db}
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      REDIS_URL: redis://redis:6379
      DATASET_PATH: /data/Attack_Dataset.csv
      INTEGRATION_HUB_URL: http://integration-hub:8500
      SERVICE_API_KEY_INTEGRATION_HUB: ${SERVICE_API_KEY_INTEGRATION_HUB}
      SERVICE_API_KEY_ORCHESTRATOR: ${SERVICE_API_KEY_ORCHESTRATOR}
      SERVICE_API_KEY_ANALYZER: ${SERVICE_API_KEY_ANALYZER}
      SERVICE_API_KEY_MONITOR: ${SERVICE_API_KEY_MONITOR}
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      WORKERS: "4"
      MAX_REQUESTS: "1000"
      MAX_REQUESTS_JITTER: "100"
      TIMEOUT: "300"
    volumes:
      - ./Attack_Dataset.csv:/data/Attack_Dataset.csv:ro
      - knowledge_engine_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    restart: unless-stopped
    networks:
      - opsec-network
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  orchestrator:
    build:
      context: ./backend/orchestrator
      dockerfile: Dockerfile
      target: production
    image: opsec/orchestrator:latest
    ports:
      - "${ORCHESTRATOR_PORT:-3001}:3001"
    environment:
      PORT: "3001"
      KNOWLEDGE_ENGINE_URL: http://knowledge-engine:8000
      ANALYZER_URL: http://realtime-analyzer:8001
      OPSEC_URL: http://opsec-monitor:8002
      INTEGRATION_HUB_URL: http://integration-hub:8500
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-opsec}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-attack_db}
      REDIS_URL: redis://redis:6379
      SERVICE_API_KEY_ORCHESTRATOR: ${SERVICE_API_KEY_ORCHESTRATOR}
      ORCHESTRATOR_API_KEY: ${ORCHESTRATOR_API_KEY:-}
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      NODE_ENV: production
    volumes:
      - orchestrator_logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    restart: unless-stopped
    networks:
      - opsec-network
    depends_on:
      knowledge-engine:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  integration-hub:
    build:
      context: ./backend/integrations
      dockerfile: Dockerfile
      target: production
    image: opsec/integration-hub:latest
    ports:
      - "${INTEGRATION_HUB_PORT:-8500}:8500"
    environment:
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: 8500
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      INTEGRATION_CONFIG_DIR: integrations
      REDIS_URL: redis://redis:6379
      OPSEC_MONITOR_URL: http://localhost:8002
      OPSEC_ASSESSMENT_ENABLED: "true"
      JAILBREAK_API_KEY: ${JAILBREAK_API_KEY}
      SERVICE_API_KEY_INTEGRATION_HUB: ${SERVICE_API_KEY_INTEGRATION_HUB}
      SERVICE_API_KEY_ORCHESTRATOR: ${SERVICE_API_KEY_ORCHESTRATOR}
    volumes:
      - ./backend/integrations/integrations:/app/integrations:ro
      - ./backend/shared:/app/shared:ro
      - integration_hub_logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    restart: unless-stopped
    networks:
      - opsec-network
    depends_on:
      redis:
        condition: service_healthy
    cap_add:
      - NET_RAW
      - NET_ADMIN
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  dashboard:
    build:
      context: ./frontend/dashboard
      dockerfile: Dockerfile
      target: production
    image: opsec/dashboard:latest
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3001}
      NEXT_PUBLIC_ORCHESTRATOR_URL: ${NEXT_PUBLIC_ORCHESTRATOR_URL:-http://localhost:3001}
      NEXT_PUBLIC_ORCHESTRATOR_API_KEY: ${ORCHESTRATOR_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    restart: unless-stopped
    networks:
      - opsec-network
    depends_on:
      orchestrator:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: opsec-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
      - nginx_cache:/var/cache/nginx
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
    networks:
      - opsec-network
    depends_on:
      - dashboard
      - orchestrator
      - knowledge-engine
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  opsec-network:
    driver: bridge

volumes:
  postgres_prod_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/postgres
  qdrant_prod_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/qdrant
  redis_prod_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/redis
  prometheus_prod_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/prometheus
  grafana_prod_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/grafana
  knowledge_engine_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./logs/knowledge-engine
  orchestrator_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./logs/orchestrator
  integration_hub_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./logs/integration-hub
  nginx_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./logs/nginx
  nginx_cache:
    driver: local